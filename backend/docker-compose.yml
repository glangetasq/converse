services:
  api:
    build: .
    container_name: convo_maker_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/convo_maker
      PORT: 3000
      AUTO_CREATE_TABLES: "true"
      ALLOWED_ORIGINS: "http://localhost:3000,chrome-extension://*"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: convo_maker_postgres
    environment:
      POSTGRES_DB: convo_maker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - convo_maker_postgres:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d convo_maker"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  convo_maker_postgres:
