services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: convo_maker
    ports:
      - "5432:5432"
    volumes:
      - convo_maker_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d convo_maker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/convo_maker
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace-me}
    ports:
      - "3000:3000"
    command: sh -c "npm run db:migrate && npm run dev"

  adminer:
    image: adminer:4
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  convo_maker_postgres:
