<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Converse Login</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel login-page">
      <section class="login-panel" aria-labelledby="login-title">
        <div class="brand-row">
          <p class="brand">converse</p>
        </div>
        <h1 id="login-title" class="login-title">login</h1>

        <form id="login-form" class="login-form">
          <div class="field-group">
            <label class="field-label" for="login-username-input">username</label>
            <input
              id="login-username-input"
              class="input"
              type="text"
              autocomplete="username"
              spellcheck="false"
              value="Quentin Glangetas">
          </div>

          <div class="button-row">
            <button id="login-submit-button" class="button button-primary" type="submit">login</button>
          </div>

          <p id="login-status-output" class="status-line" role="status" aria-live="polite">ready</p>
        </form>
      </section>
    </main>
    <script src="api.js"></script>
    <script src="login.js"></script>
  </body>
</html>
