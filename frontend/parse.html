<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Converse Messages</title>
    <link rel="stylesheet" href="parse.css">
  </head>
  <body>
    <main class="parse-app">
      <header class="parse-header">
        <div class="parse-title-group">
          <p class="eyebrow">Converse</p>
          <h1>linkedin messages</h1>
        </div>

        <div class="parse-toolbar">
          <button id="refresh-button" class="icon-button" type="button" aria-label="refresh parse result" title="refresh parse result">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" />
              <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
            </svg>
          </button>
        </div>
      </header>

      <section class="source-strip" aria-label="source tab">
        <span id="status-pill" class="status-pill">ready</span>
        <span id="source-label" class="source-label"></span>
      </section>

      <section id="state-panel" class="state-panel" hidden aria-live="polite"></section>
      <section id="summary-panel" class="summary-panel" hidden aria-label="parse summary"></section>
      <section id="parse-output" class="parse-output" aria-label="parse output"></section>
    </main>

    <script src="parse.js"></script>
  </body>
</html>
