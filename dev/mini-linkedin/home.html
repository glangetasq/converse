<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini LinkedIn</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f2ee;
    color: rgba(0, 0, 0, 0.9);
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border: 1px solid #e0dfdc;
    border-radius: 8px;
    padding: 32px 40px;
    text-align: center;
  }
  .card__title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .card > p { color: rgba(0, 0, 0, 0.6); font-size: 13px; margin-bottom: 20px; }
  ul { list-style: none; display: grid; gap: 10px; }
  a {
    display: block;
    padding: 10px 18px;
    border-radius: 20px;
    border: 1px solid #0a66c2;
    color: #0a66c2;
    font-weight: 600;
    text-decoration: none;
  }
  a:hover { background: #eaf3fb; }
</style>
</head>
<body>
<div class="card">
  <div class="card__title">Mini LinkedIn</div>
  <p>Local test fixture pages for the extension parsers</p>
  <ul>
    <li><a href="/messaging/thread/abc/">Messaging thread</a></li>
    <li><a href="/in/maya-lindqvist">Profile: Maya Lindqvist</a></li>
  </ul>
</div>
</body>
</html>
